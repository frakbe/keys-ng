name: Diagnose 0.1.24 regression suite
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    if: github.event.head_commit.message == 'Diagnose 0.1.24'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        filter:
          - test_keepassxc_xml_import_preserves_hierarchy_totp_and_custom_fields
          - test_keepassxc_xml_import_rejects_doctype
          - test_kdbx_bridge_uses_keepassxc_cli_stdout
          - test_keepassxc_import_preserves_entry_uuid_and_uuid_references
          - test_keepassxc_uuid_collision_remaps_imported_entry_and_references
          - test_keepassxc_dangling_reference_fails_before_writing_entries
          - test_keepassxc_dry_run_validates_references_without_writing
          - test_keepassxc_import_preserves_unmapped_commands_in_notes_and_report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install pytest textual platformdirs
      - run: python -m pytest -q tests/test_keepassxc_import.py -k ${{ matrix.filter }}
