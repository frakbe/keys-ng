name: Release 0.1.21

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release 0.1.21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest textual platformdirs

      - name: Run regression suite
        run: |
          set +e
          python -m pytest -q > pytest-release.log 2>&1
          code=$?
          cat pytest-release.log
          if [ "$code" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pytest-release.log
            git commit -m "Record 0.1.21 release test failure"
            git push
            exit "$code"
          fi

      - name: Build wheel
        run: python -m build --wheel

      - name: Smoke-test wheel
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/keys_ng-0.1.21-py3-none-any.whl
          .release-venv/bin/keys-ng --version
          .release-venv/bin/keys-ng-tui version

      - name: Checksums
        run: sha256sum dist/keys_ng-0.1.21-py3-none-any.whl > SHA256SUMS-0.1.21

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.21             dist/keys_ng-0.1.21-py3-none-any.whl             SHA256SUMS-0.1.21             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Keys NG 0.1.21"             --notes-file RELEASE_NOTES_M1.21.md
