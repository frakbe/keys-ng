app-id: org.keysng.KeysNG
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: keys-ng-gui

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Vaults selected from the user's home are read/written directly.
  - --filesystem=home
  # Keys NG deliberately delegates GnuPG, SSH and RDP launchers to the host.
  # This keeps the host gpg-agent/private-key setup and external clients usable.
  - --talk-name=org.freedesktop.Flatpak

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # Generated by packaging/flatpak/generate-python-sources.sh.
  - python3-flatpak-requirements.json

  - name: keys-ng
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 packaging/flatpak/org.keysng.KeysNG.desktop /app/share/applications/org.keysng.KeysNG.desktop
      - install -Dm644 packaging/flatpak/org.keysng.KeysNG.metainfo.xml /app/share/metainfo/org.keysng.KeysNG.metainfo.xml
      - install -Dm644 src/keys_ng/resources/keys-icon.png /app/share/icons/hicolor/64x64/apps/org.keysng.KeysNG.png
    sources:
      - type: dir
        path: ../..
